<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Olympia Sóc Sơn – sân chơi kiến thức dành cho học sinh THPT huyện Sóc Sơn từ năm 2017." />
    <link rel="icon" type="image/svg+xml" href="/logo-oss-tam.svg" />
    <script>
      // Favicon: thử logo-oss.svg → logo-oss.png, file nào tải được thì dùng; không có thì giữ logo tạm.
      (function () {
        var link = document.querySelector('link[rel="icon"]');
        if (!link) return;
        var files = [["logo-oss.svg", "image/svg+xml"], ["logo-oss.png", "image/png"]];
        (function next(i) {
          if (i >= files.length) return;
          var url = new URL(files[i][0], link.href).href;
          var img = new Image();
          img.onload = function () {
            link.href = url;
            link.type = files[i][1];
          };
          img.onerror = function () {
            next(i + 1);
          };
          img.src = url;
        })(0);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap"
      rel="stylesheet"
    />
    <title>Olympia Sóc Sơn</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
