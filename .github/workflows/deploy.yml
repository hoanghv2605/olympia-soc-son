# Tự động build và đưa web lên GitHub Pages mỗi khi push lên nhánh main.
# Lần đầu: vào repo trên GitHub → Settings → Pages → Source: chọn "GitHub Actions".
# Tách 2 job: "build" tải bản web lên xong hẳn rồi "deploy" mới chạy,
# để bước deploy luôn tìm thấy bản build (tránh lỗi "No artifacts named github-pages").
name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lần deploy chạy tại một thời điểm; không huỷ lần đang chạy dở.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
